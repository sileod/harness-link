name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m py_compile src/harness_link/*.py bin/harness-link bin/hlink bin/harness-link-spawn bin/albert bin/albert-spawn bin/nim bin/nim-spawn bin/inferx bin/inferx-spawn bin/orfree bin/orfree-spawn
      - run: bash -n install.sh
      - run: grep -q 'raw.githubusercontent.com/sileod/harness-link/main' install.sh
      - run: PYTHONPATH=src python bin/harness-link --version && PYTHONPATH=src python bin/hlink --version && PYTHONPATH=src python bin/albert --version && PYTHONPATH=src python bin/nim --version && PYTHONPATH=src python bin/inferx --version && PYTHONPATH=src python bin/orfree --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m venv /tmp/harness-link-wheel
      - run: /tmp/harness-link-wheel/bin/python -m pip install dist/*.whl
      - run: |
          /tmp/harness-link-wheel/bin/harness-link --version
          /tmp/harness-link-wheel/bin/hlink --version
          /tmp/harness-link-wheel/bin/albert --version
          /tmp/harness-link-wheel/bin/nim --version
          /tmp/harness-link-wheel/bin/inferx --version
          /tmp/harness-link-wheel/bin/orfree --version
          /tmp/harness-link-wheel/bin/harness-link-spawn --version

  spawn-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - run: PYTHONPATH=src ALBERT_API_KEY=test python bin/albert-spawn matrix >/dev/null
      - run: PYTHONPATH=src NVIDIA_API_KEY=test python bin/nim-spawn matrix >/dev/null
